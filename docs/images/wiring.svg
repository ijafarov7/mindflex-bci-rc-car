<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 830" width="100%" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>Verkabelung</title>
<desc>Oben die EEG-Seite: TGAM-Modul im MindFlex-Headset mit T-Pin an Pin 0 und GND an GND des Arduino Uno, BLE-Modul an 3,3 V mit RXD direkt an Pin 1, Versorgung über einen 9-V-Block am Rundstecker. Unten die Auto-Seite: Arduino Duemilanove mit L293D-Shield, Motoren M1 vorne rechts, M2 vorne links, M3 hinten links, M4 hinten rechts, BLE-Modul an 3,3 V mit TXD an Pin 10 und RXD optional direkt an A0, 9-V-Block als Stromversorgung.</desc>
<style>
  .bg { fill: #ffffff; }
  .hw { fill: #e6f1fb; stroke: #185fa5; }
  .hw-t { fill: #0c447c; }
  .mc { fill: #eef6ee; stroke: #2e7d4f; }
  .mc-t { fill: #1a4d30; }
  .bt { fill: #f1ecfb; stroke: #6a43b5; }
  .bt-t { fill: #3f2582; }
  .pw { fill: #fdf3e3; stroke: #b5730e; }
  .pw-t { fill: #6b4100; }
  .mo { fill: #f4f4f2; stroke: #898781; }
  .mo-t { fill: #2b2a27; }
  .pin { fill: #2b2a27; }
  .sub { fill: #5f5e5a; }
  .w { stroke: #44423d; }
  .ws { stroke: #c0392b; }
  .res { fill: #ffffff; stroke: #44423d; }
  .sec { fill: #2b2a27; }
  .sep { stroke: #d5d3cc; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #0d1117; }
    .hw { fill: #0f2a44; stroke: #4c94d8; }
    .hw-t { fill: #cfe4f8; }
    .mc { fill: #10291a; stroke: #3fb871; }
    .mc-t { fill: #c9efd8; }
    .bt { fill: #251a3d; stroke: #9a7ae0; }
    .bt-t { fill: #e2d8f8; }
    .pw { fill: #33240a; stroke: #e0a040; }
    .pw-t { fill: #f6dcae; }
    .mo { fill: #1f2328; stroke: #8b949e; }
    .mo-t, .pin, .sec { fill: #e6edf3; }
    .sub { fill: #9da5ae; }
    .w { stroke: #c9d1d9; }
    .ws { stroke: #ff7b72; }
    .res { fill: #0d1117; stroke: #c9d1d9; }
    .sep { stroke: #30363d; }
  }
  rect { stroke-width: 1.2; }
  .t { font-size: 14px; font-weight: 600; }
  .s { font-size: 11.5px; }
  .p { font-size: 11.5px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .h { font-size: 15px; font-weight: 700; }
  .w, .ws { stroke-width: 1.8; fill: none; }
  .g line { stroke-width: 1.6; }
</style>

<rect class="bg" x="0" y="0" width="760" height="830" rx="12" style="stroke:none"/>

<!-- ============ EEG-SEITE ============ -->
<text class="h sec" x="30" y="34">EEG-Seite: Headset → Arduino Uno</text>

<!-- TGAM -->
<rect class="hw" x="30" y="60" width="170" height="120" rx="8"/>
<text class="t hw-t" x="46" y="84">MindFlex-Headset</text>
<text class="s sub" x="46" y="101">TGAM-Modul (NeuroSky)</text>
<text class="p pin" x="186" y="134" text-anchor="end">T</text>
<text class="p pin" x="186" y="164" text-anchor="end">GND</text>

<!-- Uno -->
<rect class="mc" x="300" y="50" width="180" height="215" rx="8"/>
<text class="t mc-t" x="390" y="74" text-anchor="middle">Arduino Uno</text>
<text class="s sub" x="390" y="91" text-anchor="middle">mindflex_eeg.ino</text>
<text class="p pin" x="308" y="134">Pin 0 (RX)</text>
<text class="p pin" x="308" y="164">GND</text>
<text class="p pin" x="472" y="118" text-anchor="end">Pin 1 (TX)</text>
<text class="p pin" x="472" y="198" text-anchor="end">3.3V</text>
<text class="p pin" x="472" y="228" text-anchor="end">GND</text>
<text class="s sub" x="390" y="257" text-anchor="middle">Rundstecker</text>

<line class="w" x1="200" y1="130" x2="300" y2="130"/>
<text class="s sub" x="250" y="123" text-anchor="middle">T-Pin → RX</text>
<line class="w" x1="200" y1="160" x2="300" y2="160"/>

<!-- BLE (EEG) -->
<rect class="bt" x="600" y="70" width="140" height="175" rx="8"/>
<text class="t bt-t" x="670" y="264" text-anchor="middle">BLE-Modul</text>
<text class="s sub" x="670" y="281" text-anchor="middle">CC2541 (HM-10), optional</text>
<text class="p pin" x="608" y="118">RXD</text>
<text class="p pin" x="608" y="148">TXD  (frei)</text>
<text class="p pin" x="608" y="198">VCC</text>
<text class="p pin" x="608" y="228">GND</text>

<!-- RXD direkt -->
<line class="w" x1="480" y1="114" x2="600" y2="114"/>
<text class="s sub" x="540" y="107" text-anchor="middle">TX → RXD</text>

<line class="w" x1="480" y1="194" x2="600" y2="194"/>
<line class="w" x1="480" y1="224" x2="600" y2="224"/>

<!-- 9V -->
<rect class="pw" x="300" y="300" width="180" height="44" rx="8"/>
<text class="t pw-t" x="390" y="322" text-anchor="middle">9-V-Block mit Schalter</text>
<text class="s sub" x="390" y="337" text-anchor="middle">wenn kein USB-Kabel steckt</text>
<line class="w" x1="390" y1="300" x2="390" y2="265"/>

<text class="s sub" x="510" y="314">Alle Verbindungen direkt,</text>
<text class="s sub" x="510" y="330">ohne Widerstände – so aufgebaut</text>
<text class="s sub" x="510" y="346">und getestet.</text>

<line class="sep" x1="30" y1="372" x2="730" y2="372" stroke-width="1"/>

<!-- ============ AUTO-SEITE ============ -->
<text class="h sec" x="30" y="404">Auto-Seite: Duemilanove + L293D-Shield</text>

<rect class="pw" x="290" y="418" width="180" height="40" rx="8"/>
<text class="t pw-t" x="380" y="436" text-anchor="middle">9-V-Block</text>
<text class="s sub" x="380" y="451" text-anchor="middle">Stromversorgung des Autos</text>
<line class="w" x1="380" y1="458" x2="380" y2="480"/>

<rect class="mc" x="270" y="480" width="220" height="180" rx="8"/>
<text class="t mc-t" x="380" y="560" text-anchor="middle">Arduino Duemilanove</text>
<text class="s sub" x="380" y="578" text-anchor="middle">+ L293D-Shield (HW-130)</text>
<text class="s sub" x="380" y="594" text-anchor="middle">rc_car_4wd.ino</text>
<text class="p pin" x="278" y="519">M2</text>
<text class="p pin" x="278" y="634">M3</text>
<text class="p pin" x="482" y="519" text-anchor="end">M1</text>
<text class="p pin" x="482" y="634" text-anchor="end">M4</text>
<text class="p pin" x="310" y="652" text-anchor="middle">A0</text>
<text class="p pin" x="362" y="652" text-anchor="middle">10</text>
<text class="p pin" x="412" y="652" text-anchor="middle">3.3V</text>
<text class="p pin" x="458" y="652" text-anchor="middle">GND</text>

<!-- Motoren -->
<rect class="mo" x="50" y="490" width="140" height="50" rx="8"/>
<text class="t mo-t" x="120" y="511" text-anchor="middle">Motor M2</text>
<text class="s sub" x="120" y="528" text-anchor="middle">vorne links</text>
<rect class="mo" x="50" y="605" width="140" height="50" rx="8"/>
<text class="t mo-t" x="120" y="626" text-anchor="middle">Motor M3</text>
<text class="s sub" x="120" y="643" text-anchor="middle">hinten links</text>
<rect class="mo" x="570" y="490" width="140" height="50" rx="8"/>
<text class="t mo-t" x="640" y="511" text-anchor="middle">Motor M1</text>
<text class="s sub" x="640" y="528" text-anchor="middle">vorne rechts</text>
<rect class="mo" x="570" y="605" width="140" height="50" rx="8"/>
<text class="t mo-t" x="640" y="626" text-anchor="middle">Motor M4</text>
<text class="s sub" x="640" y="643" text-anchor="middle">hinten rechts</text>
<line class="w" x1="190" y1="515" x2="270" y2="515"/>
<line class="w" x1="190" y1="630" x2="270" y2="630"/>
<line class="w" x1="490" y1="515" x2="570" y2="515"/>
<line class="w" x1="490" y1="630" x2="570" y2="630"/>

<!-- BLE (Auto) -->
<rect class="bt" x="280" y="745" width="200" height="60" rx="8"/>
<text class="p pin" x="310" y="762" text-anchor="middle">RXD</text>
<text class="p pin" x="362" y="762" text-anchor="middle">TXD</text>
<text class="p pin" x="412" y="762" text-anchor="middle">VCC</text>
<text class="p pin" x="458" y="762" text-anchor="middle">GND</text>
<text class="t bt-t" x="380" y="784" text-anchor="middle">BLE-Modul</text>
<text class="s sub" x="380" y="799" text-anchor="middle">CC2541 (HM-10)</text>

<line class="w" x1="362" y1="660" x2="362" y2="745"/>
<line class="w" x1="412" y1="660" x2="412" y2="745"/>
<line class="w" x1="458" y1="660" x2="458" y2="745"/>

<!-- Rückkanal direkt, optional -->
<line class="w" x1="310" y1="660" x2="310" y2="745" stroke-dasharray="5 4"/>

<text class="s sub" x="510" y="700">Pin 10 empfängt die Fahrbefehle.</text>
<text class="s sub" x="510" y="716">A0 (gestrichelt) nur für den Rückkanal.</text>
<text class="s sub" x="510" y="732">Nicht Pin 11 benutzen – dort liegt</text>
<text class="s sub" x="510" y="748">der PWM-Ausgang von Motor 1.</text>
</svg>
