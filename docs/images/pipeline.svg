<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 820" width="100%" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>MindFlex BCI Pipeline</title>
<desc>Datenfluss vom MindFlex-Headset über den EEG-Arduino per USB oder Bluetooth zur Python-Anwendung (Empfang, Vorverarbeitung, Feature-Extraktion, Klassifikation, GUI) und von dort per Bluetooth an den Arduino im RC-Auto. Parallel visualisiert der BrainGrapher die Rohdaten.</desc>
<style>
  .bg { fill: #ffffff; }
  .hw { fill: #e6f1fb; stroke: #185fa5; }
  .hw-t { fill: #0c447c; }
  .py { fill: #f1ecfb; stroke: #6a43b5; }
  .py-t { fill: #3f2582; }
  .ct { fill: #faf8fe; stroke: #6a43b5; stroke-dasharray: 5 4; }
  .out { fill: #e7f6ec; stroke: #1f8a4c; }
  .out-t { fill: #11552e; }
  .side { fill: #f4f4f2; stroke: #898781; }
  .side-t { fill: #2b2a27; }
  .sub { fill: #5f5e5a; }
  .lbl { fill: #5f5e5a; }
  .ar { stroke: #898781; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #0d1117; }
    .hw { fill: #0f2a44; stroke: #4c94d8; }
    .hw-t { fill: #cfe4f8; }
    .py { fill: #251a3d; stroke: #9a7ae0; }
    .py-t { fill: #e2d8f8; }
    .ct { fill: #16121f; stroke: #9a7ae0; }
    .out { fill: #0f2f1d; stroke: #3fb871; }
    .out-t { fill: #c9efd8; }
    .side { fill: #1f2328; stroke: #8b949e; }
    .side-t { fill: #e6edf3; }
    .sub, .lbl { fill: #9da5ae; }
    .ar { stroke: #8b949e; }
  }
  rect { stroke-width: 1; }
  .t { font-size: 14px; font-weight: 600; text-anchor: middle; }
  .s { font-size: 11.5px; text-anchor: middle; }
  .l { font-size: 11.5px; font-style: italic; }
  line, path.ar { stroke-width: 1.5; fill: none; }
</style>
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#898781" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<rect class="bg" x="0" y="0" width="680" height="820" rx="12" style="stroke:none"/>

<!-- Hardware oben -->
<rect class="hw" x="220" y="24" width="240" height="56" rx="8"/>
<text class="t hw-t" x="340" y="48">MindFlex-Headset</text>
<text class="s sub" x="340" y="66">ThinkGear-Chip · Stirnelektrode</text>
<line class="ar" x1="340" y1="80" x2="340" y2="108" marker-end="url(#a)"/>

<rect class="hw" x="220" y="110" width="240" height="56" rx="8"/>
<text class="t hw-t" x="340" y="134">EEG-Arduino (Uno)</text>
<text class="s sub" x="340" y="152">mindflex_eeg.ino · CSV-Zeilen</text>

<path class="ar" d="M300 166 L300 190 L130 190 L130 230" marker-end="url(#a)"/>
<path class="ar" d="M380 166 L380 190 L460 190 L460 230" marker-end="url(#a)"/>
<text class="l lbl" x="472" y="186">USB oder Bluetooth LE</text>

<!-- BrainGrapher -->
<rect class="side" x="30" y="232" width="200" height="74" rx="8"/>
<text class="t side-t" x="130" y="256">BrainGrapher</text>
<text class="s sub" x="130" y="274">Processing · Python</text>
<text class="s sub" x="130" y="291">Live-Visualisierung der Rohdaten</text>

<!-- Python-Anwendung -->
<rect class="ct" x="270" y="232" width="380" height="474" rx="12"/>
<text class="t py-t" x="460" y="256">MindFlex_BCI_Projekt (Python)</text>

<rect class="py" x="310" y="270" width="300" height="50" rx="8"/>
<text class="t py-t" x="460" y="291">Empfang</text>
<text class="s sub" x="460" y="309">serial_receiver · ble_serial_receiver</text>
<line class="ar" x1="460" y1="320" x2="460" y2="338" marker-end="url(#a)"/>

<rect class="py" x="310" y="340" width="300" height="50" rx="8"/>
<text class="t py-t" x="460" y="361">Vorverarbeitung</text>
<text class="s sub" x="460" y="379">brain_processor · Validierung, Ringpuffer</text>
<line class="ar" x1="460" y1="390" x2="460" y2="408" marker-end="url(#a)"/>

<rect class="py" x="310" y="410" width="300" height="50" rx="8"/>
<text class="t py-t" x="460" y="431">Feature-Extraktion</text>
<text class="s sub" x="460" y="449">feature_extractor · Bandleistungen, eSense</text>
<line class="ar" x1="460" y1="460" x2="460" y2="478" marker-end="url(#a)"/>

<rect class="py" x="310" y="480" width="300" height="50" rx="8"/>
<text class="t py-t" x="460" y="501">Klassifikation</text>
<text class="s sub" x="460" y="519">classifier · KNN, Random Forest, Decision Tree</text>
<line class="ar" x1="460" y1="530" x2="460" y2="548" marker-end="url(#a)"/>

<rect class="py" x="310" y="550" width="300" height="50" rx="8"/>
<text class="t py-t" x="460" y="571">Oberfläche</text>
<text class="s sub" x="460" y="589">PyQt5-GUI · Vorhersage, Fahrsperre, Handbetrieb</text>
<line class="ar" x1="460" y1="600" x2="460" y2="618" marker-end="url(#a)"/>

<rect class="py" x="310" y="620" width="300" height="50" rx="8"/>
<text class="t py-t" x="460" y="641">Autosteuerung</text>
<text class="s sub" x="460" y="659">car_controller · ble_car_controller</text>

<!-- Training -->
<rect class="side" x="30" y="470" width="200" height="70" rx="8"/>
<text class="t side-t" x="130" y="494">Training &amp; Kalibrierung</text>
<text class="s sub" x="130" y="512">trainer · Profile mit</text>
<text class="s sub" x="130" y="528">Trainingsdaten und Modell</text>
<line class="ar" x1="230" y1="505" x2="308" y2="505" marker-end="url(#a)"/>

<!-- Auto -->
<line class="ar" x1="460" y1="670" x2="460" y2="732" marker-end="url(#a)"/>
<text class="l lbl" x="472" y="724">F / B / L / R / S per Bluetooth LE</text>

<rect class="out" x="270" y="734" width="380" height="62" rx="8"/>
<text class="t out-t" x="460" y="758">RC-Auto (Arduino Duemilanove)</text>
<text class="s sub" x="460" y="777">rc_car_4wd.ino · L293D-Shield · 4 Motoren, Panzer-Lenkung</text>
</svg>
